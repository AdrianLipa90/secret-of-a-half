name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,monograph]

      - name: Run regression tests
        run: python -m pytest -q

      - name: Generate deterministic assets
        run: python scripts/generate_monograph_assets.py

      - name: Run native PhaseNav receipt
        run: python scripts/run_phasenav_theta_bridge.py

      - name: Run PhaseNav-Weil positivity receipt
        run: python scripts/run_phasenav_weil_probe.py

      - name: Run PhaseNav-Weil arithmetic receipt
        run: python scripts/run_phasenav_weil_arithmetic.py

      - name: Run PhaseNav-Weil Hermite ladder receipt
        run: python scripts/run_phasenav_weil_hermite_ladder.py

      - name: Run zero-undefined reciprocal duality receipt
        run: python scripts/run_zero_undefined_duality.py

      - name: Run PhaseNav-Weil prime-tail certificate
        run: python scripts/run_phasenav_weil_prime_tail.py

      - name: Run PhaseNav-Weil adaptive cutoff schedule
        run: python scripts/run_phasenav_weil_adaptive_cutoff.py

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            lmodern

      - name: Compile monograph
        working-directory: monograph
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          test -n "$pages"
          printf 'Validated monograph pages: %s\n' "$pages" | tee main.pdf.pages.txt
          ! grep -E "Overfull|undefined references|Citation.*undefined" main.log

      - name: Upload compiled monograph
        uses: actions/upload-artifact@v4
        with:
          name: secret-of-a-half-monograph-v0.7
          path: |
            monograph/main.pdf
            monograph/main.pdf.pages.txt
          if-no-files-found: error
