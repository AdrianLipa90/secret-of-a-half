name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit runtime dependency boundary
        run: python scripts/audit_runtime_dependency_boundary.py

      - name: Upload dependency boundary receipt
        uses: actions/upload-artifact@v4
        with:
          name: secret-of-a-half-runtime-dependency-boundary-v1
          path: data/processed/runtime_dependency_boundary.json
          if-no-files-found: error

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy matplotlib mpmath

      - name: Run general regression tests
        # Stage M is intentionally excluded here because its exact exhaustive
        # certificate has a dedicated DHSE workflow/job. Running it twice on
        # every PR head wastes CI resources without adding independent coverage.
        run: python -m pytest -q --ignore=tests/test_dhse_001_stage_m.py

      - name: Generate deterministic assets
        run: python scripts/generate_monograph_assets.py

      - name: Run native PhaseNav receipt
        run: python scripts/run_phasenav_theta_bridge.py

      - name: Run PhaseNav-Weil positivity receipt
        run: python scripts/run_phasenav_weil_probe.py

      - name: Run PhaseNav-Weil arithmetic receipt
        run: python scripts/run_phasenav_weil_arithmetic.py

      - name: Run PhaseNav-Weil Hermite ladder receipt
        run: python scripts/run_phasenav_weil_hermite_ladder.py

      - name: Run zero-undefined reciprocal duality receipt
        run: python scripts/run_zero_undefined_duality.py

      - name: Run PhaseNav-Weil prime-tail certificate
        run: python scripts/run_phasenav_weil_prime_tail.py

      - name: Run PhaseNav-Weil adaptive cutoff schedule
        run: python scripts/run_phasenav_weil_adaptive_cutoff.py

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            poppler-utils

      - name: Compile monograph
        working-directory: monograph
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          PAGES="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          echo "Compiled monograph pages: $PAGES"
          test "$PAGES" -ge 108
          ! grep -E "Overfull|undefined references|Citation.*undefined" main.log

      - name: Upload compiled monograph
        uses: actions/upload-artifact@v4
        with:
          name: secret-of-a-half-monograph-v0.6.1-review
          path: monograph/main.pdf
          if-no-files-found: error
