[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-of-a-half"
version = "0.6.1"
description = "Information-spinor, native PhaseNav, Weil-Hermite, reciprocal self-duality, exact finite DHSE classification, prime-tail certification, and adaptive-cutoff workspace."
requires-python = ">=3.10"
authors = [{name = "Adrian Lipa"}]
dependencies = [
  "numpy",
  "mpmath",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
