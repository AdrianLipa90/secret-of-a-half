name: Vectorized build and test experiment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vectorized-build-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-vector:
    name: vector / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        lane:
          - general-tests
          - theta-bridge
          - weil-positivity
          - weil-arithmetic
          - hermite-ladder
          - reciprocal-duality
          - prime-tail
          - c005-cross-block-prime-tail
          - c005-finite-ladder-coupling
          - c005-infinite-window-schedule
          - c005-growing-window-tail
          - c005-twisted-prime
          - c005-full-operator-cancellation
          - soh-g004-log-concavity
          - soh-g005-pf3-diagnostic
          - soh-g014-zero-set-no-go
          - soh-g015-quotient-zero-set-no-go
          - soh-g016-paired-spectrum-quotient
          - soh-g017-fixed-point-exclusion
          - soh-g018-quarter-disk-exclusion
          - soh-g019-caratheodory-disk
          - soh-g020-half-mass-pf2
          - soh-g021-half-mass-pf3-no-go
          - soh-g022-pf3-curvature-barrier
          - soh-g023-reciprocal-deficit
          - soh-g024-jensen-wiener-kernel
          - soh-g024-global-second-order
          - soh-g024-third-order-frontier
          - adaptive-cutoff
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy matplotlib mpmath

      - name: Execute vector lane
        run: |
          case "${{ matrix.lane }}" in
            general-tests)
              python -m pytest -q --ignore=tests/test_dhse_001_stage_m.py
              ;;
            theta-bridge)
              python scripts/run_phasenav_theta_bridge.py
              ;;
            weil-positivity)
              python scripts/run_phasenav_weil_probe.py
              ;;
            weil-arithmetic)
              python scripts/run_phasenav_weil_arithmetic.py
              ;;
            hermite-ladder)
              python scripts/run_phasenav_weil_hermite_ladder.py
              ;;
            reciprocal-duality)
              python scripts/run_zero_undefined_duality.py
              ;;
            prime-tail)
              python scripts/run_phasenav_weil_prime_tail.py
              ;;
            c005-cross-block-prime-tail)
              python scripts/run_c005_cross_block_prime_tail.py
              ;;
            c005-finite-ladder-coupling)
              python scripts/run_c005_finite_ladder_coupling.py
              ;;
            c005-infinite-window-schedule)
              python scripts/run_c005_infinite_window_schedule.py
              ;;
            c005-growing-window-tail)
              python scripts/run_c005_growing_window_tail_diagnostic.py
              ;;
            c005-twisted-prime)
              python scripts/run_c005_twisted_prime_summation.py
              ;;
            c005-full-operator-cancellation)
              python scripts/run_c005_full_operator_cancellation.py
              ;;
            soh-g004-log-concavity)
              python scripts/run_soh_g004_global_log_concavity.py
              ;;
            soh-g005-pf3-diagnostic)
              python scripts/run_soh_g005_pf3_diagnostic.py
              ;;
            soh-g014-zero-set-no-go)
              python scripts/run_soh_g014_negative_inversion_zero_set.py
              ;;
            soh-g015-quotient-zero-set-no-go)
              python scripts/run_soh_g015_quotient_zero_set.py
              ;;
            soh-g016-paired-spectrum-quotient)
              python scripts/run_soh_g016_paired_spectrum_quotient.py
              ;;
            soh-g017-fixed-point-exclusion)
              python scripts/run_soh_g017_fixed_point_exclusion.py
              ;;
            soh-g018-quarter-disk-exclusion)
              python scripts/run_soh_g018_quarter_disk_exclusion.py
              ;;
            soh-g019-caratheodory-disk)
              python scripts/run_soh_g019_caratheodory_disk.py
              ;;
            soh-g020-half-mass-pf2)
              python scripts/run_soh_g020_half_mass_pf2.py
              ;;
            soh-g021-half-mass-pf3-no-go)
              python scripts/run_soh_g021_half_mass_pf3_no_go.py
              ;;
            soh-g022-pf3-curvature-barrier)
              python scripts/run_soh_g022_pf3_curvature_barrier.py
              ;;
            soh-g023-reciprocal-deficit)
              python scripts/run_soh_g023_reciprocal_deficit.py
              ;;
            soh-g024-jensen-wiener-kernel)
              python scripts/run_soh_g024_jensen_wiener_kernel.py
              ;;
            soh-g024-global-second-order)
              python scripts/run_soh_g024_jensen_wiener_kernel.py
              python scripts/run_soh_g024_fourth_log_curvature_interval.py
              python scripts/run_soh_g024_global_second_order.py
              ;;
            soh-g024-third-order-frontier)
              python scripts/run_soh_g024_third_order_frontier.py
              ;;
            adaptive-cutoff)
              python scripts/run_phasenav_weil_adaptive_cutoff.py
              ;;
            *)
              echo "Unknown vector lane: ${{ matrix.lane }}" >&2
              exit 2
              ;;
          esac

  monograph:
    name: vector / monograph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy matplotlib mpmath

      - name: Audit monograph completeness and claim IDs
        run: python scripts/audit_monograph_integration.py

      - name: Audit monograph semantics
        run: python scripts/audit_monograph_semantics.py

      - name: Generate deterministic core assets
        run: python scripts/generate_monograph_assets.py

      - name: Generate monograph overhaul figures
        run: python scripts/generate_monograph_overhaul_assets.py

      - name: Generate identity and holonomy assets
        run: python scripts/generate_identity_holonomy_assets.py

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-science \
            poppler-utils

      - name: Compile monograph
        working-directory: monograph
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          PAGES="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          echo "Compiled monograph pages: $PAGES"
          test "$PAGES" -ge 108
          ! grep -E "Overfull|undefined references|Citation.*undefined|multiply defined" main.log

      - name: Upload compiled monograph for manual vectorized build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-of-a-half-monograph-v0.10-mainline-g024-vector
          retention-days: 3
          path: monograph/main.pdf
          if-no-files-found: error

  reducer:
    name: vector / reducer
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python-vector
      - monograph
    steps:
      - name: Reduce vector outcomes
        run: |
          if [[ "${{ needs.python-vector.result }}" != "success" ]]; then
            echo "python-vector failed: ${{ needs.python-vector.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.monograph.result }}" != "success" ]]; then
            echo "monograph failed: ${{ needs.monograph.result }}" >&2
            exit 1
          fi
          echo "VECTOR_REDUCER_PASS"
