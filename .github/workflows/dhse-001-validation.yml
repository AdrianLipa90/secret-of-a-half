name: DHSE-001 validation

on:
  push:
    branches: [experiment/dhse-001]
    paths:
      - "src/secret_of_a_half/dhse_001*.py"
      - "tests/test_dhse_001*.py"
      - "scripts/run_dhse_001*.py"
      - "data/processed/dhse_001*.json"
      - "construction/phasenav/secret_of_half_dhse_001*.pnv"
      - "docs/experiments/DHSE-001*.md"
      - ".github/workflows/dhse-001-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/secret_of_a_half/dhse_001*.py"
      - "tests/test_dhse_001*.py"
      - "scripts/run_dhse_001*.py"
      - "data/processed/dhse_001*.json"
      - "construction/phasenav/secret_of_half_dhse_001*.pnv"
      - "docs/experiments/DHSE-001*.md"
      - ".github/workflows/dhse-001-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhse-001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  staged-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy

      - name: Run DHSE stages A through L
        run: |
          python -m pytest -q \
            tests/test_dhse_001.py \
            tests/test_dhse_001_stage_b.py \
            tests/test_dhse_001_stage_c.py \
            tests/test_dhse_001_stage_d.py \
            tests/test_dhse_001_stage_e.py \
            tests/test_dhse_001_stage_f.py \
            tests/test_dhse_001_stage_g.py \
            tests/test_dhse_001_stage_h.py \
            tests/test_dhse_001_stage_i.py \
            tests/test_dhse_001_stage_j.py \
            tests/test_dhse_001_stage_k.py \
            tests/test_dhse_001_stage_l.py

  exact-continuous-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy

      - name: Recompute and verify Stage M certificate
        run: python -m pytest -q tests/test_dhse_001_stage_m.py
